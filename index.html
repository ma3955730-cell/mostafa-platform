<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06171b"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>منصة مستر مصطفى أحمد · First Class Series 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap">
<style>
:root{--bg:#06171b;--bg2:#081f24;--card:#0d2a31;--bd:#1e4a52;--gold:#f59e0b;--em:#10b981;--tx:#e8f3f2;--mu:#8fb3b3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;min-height:100%}
header{background:var(--bg2);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center}.av{height:88px;width:auto}#ann{display:none;background:var(--gold);color:#201400;font-weight:700;text-align:center;padding:9px 12px}.item2{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:8px 0;padding:0 0 4px}.qb{padding:6px 12px 10px;border-top:1px solid var(--bd)}.q{padding:6px 0;border-bottom:1px dashed var(--bd);font-size:14px}.ans{color:var(--em);margin-top:3px}.gc{cursor:pointer}.gc:active{transform:scale(.98)}
header h1{margin:0;font-size:20px;color:var(--gold)}header small{color:var(--mu)}
nav{display:flex;gap:8px;padding:10px;justify-content:center;flex-wrap:wrap}
button,select,input{font:inherit}
.tab,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 16px;cursor:pointer}
.tab.on,.btn.gold{background:var(--gold);color:#201400;border-color:var(--gold);font-weight:700}
.btn.em{background:var(--em);color:#02241a;border-color:var(--em);font-weight:700}.btn.red{color:#fca5a5}
main{max-width:980px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.card h3{margin:0 0 6px;color:var(--gold)}.card p{margin:0 0 10px;color:var(--mu);font-size:14px}
input,select{width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0;flex-wrap:wrap}
.lock{color:var(--gold)}.ok{color:var(--em)}
#ov{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#ov .bar{padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--bg2);border-bottom:1px solid var(--bd)}
#ov iframe{flex:1;border:0;width:100%;background:#fff}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--em);color:#02241a;padding:10px 18px;border-radius:12px;font-weight:700;display:none;z-index:99;max-width:90%}
.muted{color:var(--mu);font-size:13px}

body{background:radial-gradient(900px 500px at 85% -10%,rgba(245,158,11,.16),transparent 60%),radial-gradient(800px 500px at 0% 20%,rgba(16,185,129,.14),transparent 60%),var(--bg);background-attachment:fixed}
header{background:linear-gradient(135deg,#0a2d34,#06171b 60%,#10301f);border-bottom:2px solid var(--gold);box-shadow:0 6px 30px rgba(0,0,0,.45);position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.09) 50%,transparent 65%);transform:translateX(-120%);animation:shine 5s infinite}
@keyframes shine{to{transform:translateX(120%)}}
.av{border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 4px rgba(245,158,11,.2),0 0 28px rgba(245,158,11,.55);animation:pulse 3s ease-in-out infinite;background:#fff;object-fit:cover}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(245,158,11,.1),0 0 40px rgba(245,158,11,.8)}}
header h1{font-weight:900;font-size:24px;background:linear-gradient(90deg,#fde68a,#f59e0b,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
#hero{max-width:980px;margin:14px auto 0;padding:0 12px}
#hero .hb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#hero .st{flex:1 1 130px;background:linear-gradient(145deg,rgba(13,42,49,.9),rgba(8,31,36,.9));border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center;backdrop-filter:blur(6px)}
#hero .st b{display:block;font-size:26px;color:var(--gold);font-weight:900}#hero .st span{color:var(--mu);font-size:13px}
.tab,.btn{transition:transform .18s,box-shadow .18s,background .18s}
.tab:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.tab{border-radius:999px;padding:10px 20px;font-weight:700}
.tab.on{box-shadow:0 0 18px rgba(245,158,11,.5)}
.card{position:relative;overflow:hidden;background:linear-gradient(160deg,#0f323a,#0a2329);border-radius:18px;transition:transform .25s,box-shadow .25s,border-color .25s;animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.card::before{content:"";position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--em))}
.card:hover{transform:translateY(-6px) scale(1.015);border-color:var(--gold);box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 22px rgba(245,158,11,.25)}
.card .ic{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;font-size:28px;margin-bottom:8px;background:linear-gradient(135deg,var(--gold),#d97706);box-shadow:0 6px 16px rgba(245,158,11,.4)}
.card .bd{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.bd.fr{background:rgba(16,185,129,.18);color:#6ee7b7;border:1px solid var(--em)}.bd.lk{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid var(--gold)}
.gc .ic{background:linear-gradient(135deg,var(--c1,#10b981),var(--c2,#047857));box-shadow:0 6px 16px rgba(0,0,0,.4)}
.gc.s1{--c1:#f59e0b;--c2:#b45309}.gc.s2{--c1:#10b981;--c2:#047857}.gc.s3{--c1:#8b5cf6;--c2:#5b21b6}
.item2{border-radius:16px;transition:transform .2s,border-color .2s}.item2:hover{border-color:var(--gold);transform:translateX(-3px)}
.btn.gold,.btn.em{box-shadow:0 4px 14px rgba(0,0,0,.3)}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,158,11,.22)}
#ann{animation:glow 2.4s infinite}@keyframes glow{50%{box-shadow:0 0 22px rgba(245,158,11,.8)}}
.fl{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.fl i{position:absolute;bottom:-30px;font-style:normal;opacity:.18;animation:fly linear infinite}
@keyframes fly{to{transform:translateY(-110vh) rotate(360deg)}}
header,nav,main,#hero{position:relative;z-index:1}
</style>
</head>

  $('#ak').onclick=upCourse;
  root.querySelectorAll('[data-ra]').forEach(b=>b.onclick=()=>{const q=un[+b.dataset.ra],v=$('#ra'+b.dataset.ra).value.trim();if(!v)return;updateDoc(doc(fs,'questions',q.id),{answer:v}).then(()=>toast('تم الرد ✅'))});
  root.querySelectorAll('[data-dq]').forEach(b=>b.onclick=()=>deleteDoc(doc(fs,'questions',un[+b.dataset.dq].id)).then(()=>toast('تم الحذف 🗑️')));
  root.querySelectorAll('[data-cp]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(S.codes[b.dataset.cp].code);toast('تم النسخ ✅')}catch(e){toast('تعذر النسخ')}});
  root.querySelectorAll('[data-bk]').forEach(b=>b.onclick=async()=>{const c=S.codes[+b.dataset.bk];try{await updateDoc(doc(fs,'codes',c.code),{blocked:!c.blocked});toast(c.blocked?'تم التفعيل ✅':'تم الحظر ⛔')}catch(e){toast('تعذر التنفيذ')}});
  root.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>deleteDoc(doc(fs,'codes',S.codes[+b.dataset.dc].code)).then(()=>toast('تم الحذف 🗑️')));
  root.querySelectorAll('[data-dk]').forEach(b=>b.onclick=()=>delCourse(S.courses[+b.dataset.dk]));
  root.querySelectorAll('[data-di]').forEach(b=>b.onclick=async()=>{const x=S.items[+b.dataset.di];try{if(x.fid)for(let k=0;k<x.n;k++)await deleteDoc(doc(fs,'file_chunks',x.fid+'_'+k));await deleteDoc(doc(fs,'portal_items',x.id));toast('تم الحذف 🗑️')}catch(e){toast('تعذر الحذف')}});
  $('#lo').onclick=()=>signOut(au)
}
function showAnn(){const a=$('#ann');a.textContent='📢 '+S.ann;a.style.display=S.ann?'block':'none'}

function hero(){const h=$('#hero');if(!h)return;h.innerHTML=`<div class="hb"><div class="st"><b>${S.courses.length}</b><span>📚 كورس</span></div><div class="st"><b>${S.items.filter(vis).length}</b><span>📄 مذكرة واختبار</span></div><div class="st"><b>12</b><span>🏫 صف دراسي</span></div></div><div style="text-align:center;margin-top:10px"><button class="btn gold" id="shp">📲 شارك المنصة على واتساب</button></div>`;$('#shp').onclick=()=>shareWA('🎓 منصة مستر مصطفى أحمد التعليمية - كورسات ومذكرات واختبارات لكل الصفوف')}
(function(){const f=$('#fl');['⭐','📚','✏️','🎓','💡','🔤'].forEach((e,k)=>{for(let j=0;j<3;j++){const i=document.createElement('i');i.textContent=e;i.style.cssText=`right:${Math.random()*95}%;font-size:${16+Math.random()*18}px;animation-duration:${14+Math.random()*16}s;animation-delay:-${Math.random()*20}s`;f.appendChild(i)}})})();
function render(){hero();nav();showAnn();({courses,portal,admin:adminView})[tab]()}
const sn=(q,f)=>onSnapshot(q,f,()=>{});
sn(query(collection(fs,'portal_items'),orderBy('ts','desc')),s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()}));render()});
sn(query(collection(fs,'courses'),orderBy('ts','asc')),s=>{S.courses=s.docs.map(d=>({id:d.id,...d.data()}));render()});
sn(query(collection(fs,'questions'),orderBy('ts','desc'),limit(300)),s=>{S.qs=s.docs.map(d=>({id:d.id,...d.data()}));render()});
sn(doc(fs,'site','ann'),d=>{S.ann=d.exists()?(d.data().text||''):'';showAnn()});
recheck();
onAuthStateChanged(au,u=>{admin=!!u&&u.email===ADMIN;unsubs.forEach(f=>f());unsubs=[];S.codes=[];S.scores=[];S.stats={};
  if(admin){
    unsubs.push(onSnapshot(collection(fs,'codes'),s=>{S.codes=s.docs.map(d=>({code:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));render()},()=>{}));
    unsubs.push(onSnapshot(query(collection(fs,'scores'),orderBy('ts','desc'),limit(200)),s=>{S.scores=s.docs.map(d=>d.data());render()},()=>{}));
    unsubs.push(onSnapshot(doc(fs,'stats','visits'),d=>{S.stats=d.exists()?d.data():{};render()},()=>{}))}
  render()});
render();
let dp=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
const inst=$('#inst');
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)inst.style.display='none';
inst.onclick=async()=>{
  if(dp){dp.prompt();dp=null;return}
  if(/iphone|ipad|ipod/i.test(navigator.userAgent))toast('في Safari اضغط زر المشاركة ثم "إضافة إلى الشاشة الرئيسية"');
  else toast('من قائمة المتصفح (⋮) اختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية"');
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
